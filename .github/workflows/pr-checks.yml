name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-server:
    name: Headless Linux server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install service dependencies without the desktop
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt -r mcp_server/requirements.txt
          npm ci --prefix server

      - name: Test service lifecycle, remote reconnect, chat, and MCP
        env:
          ATHENA_TEST_BACKEND: "1"
        run: npm test --prefix server

      - name: Verify CLI and systemd unit
        run: |
          .venv/bin/python -m cli server --help
          .venv/bin/python -m cli server service-file > "$RUNNER_TEMP/athena-server.service"
          systemd-analyze --user verify "$RUNNER_TEMP/athena-server.service"

  quality:
    name: Tests and regression protection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-build.txt -r mcp_server/requirements.txt pytest httpx

      - name: Run backend tests
        run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: |
          npm run test:chat
          npm run test:electron

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Test chat in Chromium
        working-directory: client
        run: |
          npx playwright install --with-deps chromium
          npm run test:chat-ui

      - name: Build and smoke-test bundled backend
        working-directory: client
        run: |
          npm run build:backend-runtime
          npm run test:backend-runtime

      - name: Run permanent regression suite
        run: python scripts/run_regression_checks.py

  windows-regressions:
    name: Windows launch regressions
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-build.txt -r mcp_server/requirements.txt pytest httpx

      - name: Run Windows-sensitive backend tests
        run: >-
          python -m pytest
          tests/test_hermes.py
          tests/test_app.py
          tests/test_chat_messages.py
          tests/test_mcp_client.py
          tests/test_mcp_server.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run Electron launch tests
        working-directory: client
        run: npm run test:electron

      - name: Build client
        working-directory: client
        run: npm run build
